
name: FastIndex Windows CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows Build & Tests
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      
      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: 'win64_msvc2022_64'
          cache: true


      - name: Configure CMake
        shell: pwsh
        run: >
          cmake -S . -B build-ci
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DBUILD_TESTING=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build build-ci --config Release --parallel 2

      - name: Run GoogleTests
        shell: pwsh
        run: ctest --test-dir build-ci -C Release --output-on-failure
